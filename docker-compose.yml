services:
  private-costs:
    build: .
    container_name: teslamate-private-costs
    restart: unless-stopped
    ports:
      # Web UI at http://<server>:4001/private-charging
      # Behind a reverse proxy you can drop this and route /private-charging
      # to the container instead (see README).
      - "${PRIVATE_COSTS_PORT:-4001}:4001"
    volumes:
      # config.yaml (edited from the web UI) is stored here.
      - ./data:/data
    # Settings come from a .env file next to this one — see .env.example.
    environment:
      - WEB_PASSWORD
      - WEB_USER
      - SECRET_KEY
      - DATABASE_HOST
      - DATABASE_PORT
      - DATABASE_NAME
      - DATABASE_USER
      - DATABASE_PASS
    networks:
      - teslamate

# Attach to the same network as your TeslaMate stack so the container can
# reach the `database` service by hostname.  Docker Compose names the default
# network "<project>_default"; for a TeslaMate stack in a folder called
# "teslamate" that is "teslamate_default".  Override with TESLAMATE_NETWORK
# in .env if yours differs (see `docker network ls`).
networks:
  teslamate:
    name: ${TESLAMATE_NETWORK:-teslamate_default}
    external: true
