{# 24 h tariff bar, coloured from cheapest (green) to most expensive (red). #}
{% macro tariff_bar_html(blocks, day='') %}
  <div class="tariff-bar" {% if day %}data-day="{{ day }}"{% endif %}>
    {% for seg in tariff_bar(blocks) %}
      <div class="seg lvl{{ seg.level }}" style="left: {{ seg.left }}%; width: {{ seg.width }}%" title="{{ seg.label }}">{{ seg.price }}</div>
    {% endfor %}
  </div>
  <div class="tariff-scale"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
{% endmacro %}
